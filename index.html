<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olá Mundo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="card">
      <span class="badge">Bem-vindo</span>
      <h1 id="greeting">Olá, Mundo! 🌍</h1>
      <p id="subtitle">O seu primeiro projeto web em HTML, CSS e JavaScript.</p>
      
      <div class="actions">
        <button id="changeGreetingBtn" class="btn primary">Mudar Saudação</button>
        <button id="themeToggleBtn" class="btn secondary">Alternar Tema</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
